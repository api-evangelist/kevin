name: Kevin.
description: >-
  kevin. was a Lithuanian account-to-account (A2A) payments infrastructure company providing PSD2
  open-banking Payment Initiation and Account Information services to merchants across 28 European
  countries. Its platform API let businesses initiate bank (SEPA) and card (hybrid) payments, issue
  refunds, read account data, and receive signed payment webhooks through a single integration to
  hundreds of banks, supported by an official Node.js SDK, a CLI, and a React UI component library.
  Backed by Accel. The company has wound down its public web presence - kevin.eu no longer resolves
  as of 2026-07 - and this profile is enriched from kevin.'s published npm packages and archived
  developer reference.
